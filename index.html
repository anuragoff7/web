    <title>𝗔𝗡𝗨𝗥𝗔𝗚 𝗔𝗥𝗠𝗬</title>
    
    <!-- THEME STYLES & FONTS -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
          --void:#05060f;--void2:#0a0b1c;--panel:#0d0f24;
          --monarch:#7c3aed;--monarch2:#a855f7;--arcane:#3b82f6;--arcane2:#38bdf8;
          --spectral:#e8e6ff;--muted:#9aa0d4;
        }
        body{font-family:'Rajdhani',-apple-system,sans-serif;background:var(--void);color:var(--spectral);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
        
        /* Ambient aura bleeding from top + corners */
        body::before{content:'';position:fixed;inset:0;background:
          radial-gradient(ellipse 65% 42% at 50% 8%,rgba(124,58,237,0.34) 0%,transparent 60%),
          radial-gradient(circle 48% at 8% 92%,rgba(59,130,246,0.24) 0%,transparent 58%),
          radial-gradient(circle 46% at 92% 82%,rgba(168,85,247,0.20) 0%,transparent 55%);
          pointer-events:none;z-index:0}
          
        /* Faint drifting energy motes */
        body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
          background-image:radial-gradient(1.5px 1.5px at 20% 30%,rgba(168,85,247,.7),transparent),radial-gradient(1.5px 1.5px at 70% 20%,rgba(56,189,248,.6),transparent),radial-gradient(1.5px 1.5px at 40% 75%,rgba(124,58,237,.6),transparent),radial-gradient(1.5px 1.5px at 85% 65%,rgba(56,189,248,.5),transparent),radial-gradient(1.5px 1.5px at 15% 60%,rgba(168,85,247,.5),transparent);
          animation:drift 9s ease-in-out infinite alternate}
        @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-14px)}}
        
        /* CARD STYLING - margin-bottom add kiya hai card ko upar karne ke liye */
        .card{position:relative;width:100%;max-width:412px;margin-bottom:8vh;background:linear-gradient(168deg,var(--panel) 0%,var(--void2) 60%,#0b0817 100%);border:1px solid rgba(124,58,237,0.32);border-radius:22px;padding:34px 24px 28px;z-index:2;
          box-shadow:0 24px 70px rgba(80,20,180,0.28),0 4px 22px rgba(0,0,0,0.6),inset 0 1px 0 rgba(180,150,255,0.10);
          animation:rise 0.6s cubic-bezier(0.16,1,0.3,1) both}
        @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
        
        /* Thin arcane top edge */
        .card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--monarch2),var(--arcane2),transparent);opacity:.8}
        
        .crest{text-align:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:600;letter-spacing:5px;color:var(--arcane2);text-transform:uppercase;margin-bottom:20px;opacity:.85}
        
        /* LOGO & AURA ANIMATIONS */
        .avatar-wrap{position:relative;width:130px;height:130px;margin:0 auto 22px}
        
        .aura{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--monarch),var(--arcane),var(--monarch2),var(--arcane2),var(--monarch));filter:blur(9px);opacity:.75;animation:spin 4.5s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        .aura2{position:absolute;inset:-5px;border-radius:50%;background:linear-gradient(135deg,var(--monarch2),var(--arcane) 55%,var(--monarch));animation:pulse 2.8s ease-in-out infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(124,58,237,0.55),0 0 46px rgba(59,130,246,0.30)}50%{box-shadow:0 0 40px rgba(168,85,247,0.85),0 0 70px rgba(56,189,248,0.45)}}
        
        /* Avatar Image */
        .avatar{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;border:3px solid #0b0817;z-index:2}
        
        /* TYPOGRAPHY */
        h1{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;line-height:1.2;text-align:center;margin-bottom:6px;
          background:linear-gradient(180deg,#ffffff 0%,#cbb8ff 48%,var(--monarch2) 130%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
          filter:drop-shadow(0 0 14px rgba(124,58,237,0.45))}
          
        .divider{width:60px;height:2px;margin:12px auto 14px;background:linear-gradient(90deg,transparent,var(--monarch2),var(--arcane2),transparent);border-radius:2px}
        
        .tagline{font-size:16px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.6px;margin-bottom:24px; text-transform: uppercase;}
        
        /* BUTTON STYLING - ctaShake animation add kiya hai */
        .cta{display:block;width:100%;position:relative;background:linear-gradient(135deg,var(--monarch) 0%,#6d28d9 45%,var(--arcane) 100%);color:#fff;padding:20px 16px;border-radius:14px;text-decoration:none;font-family:'Orbitron',sans-serif;font-weight:800;font-size:16px;letter-spacing:2px;text-transform:uppercase;text-align:center;border:1px solid rgba(180,150,255,0.4);cursor:pointer;overflow:hidden;
          box-shadow:0 14px 34px rgba(90,30,200,0.45),inset 0 1px 0 rgba(255,255,255,0.28);animation:ctaPulse 2.6s ease-in-out infinite, ctaShake 4s infinite}
        @keyframes ctaPulse{0%,100%{box-shadow:0 14px 34px rgba(90,30,200,0.45),inset 0 1px 0 rgba(255,255,255,0.28)}50%{box-shadow:0 16px 46px rgba(124,58,237,0.68),0 0 30px rgba(56,189,248,0.35),inset 0 1px 0 rgba(255,255,255,0.34)}}
        
        /* NEW: Button Shake Keyframes */
        @keyframes ctaShake {
            0%, 80%, 100% { transform: translateX(0); }
            82%, 86%, 90%, 94% { transform: translateX(-5px); }
            84%, 88%, 92%, 96% { transform: translateX(5px); }
        }

        .cta::before{content:'';position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.42),transparent);animation:sweep 3s ease-in-out infinite}
        @keyframes sweep{0%{left:-80%}55%,100%{left:130%}}
        .cta:active{transform:scale(.97)}
        .cta-arrow{margin-left:6px}
        
        .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.4px;opacity:.75}
        
        /* 30 SEC TIMER STYLING */
        .timer-box {
            margin-top: 25px;
            color: var(--arcane2);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            animation: textBlink 1.5s infinite alternate;
        }
        
        .timer-box span {
            font-size: 20px;
            font-weight: 800;
            color: var(--monarch2);
        }

        @keyframes textBlink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
